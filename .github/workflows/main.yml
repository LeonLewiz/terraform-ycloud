name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  check:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Ansible repo
        uses: actions/checkout@v4
        with:
          repository: 'LeonLewiz/ansible-lab' 
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}
          path: ansible-code

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Setup Python & Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install ansible

      - name: Export cloud key to machine.
        env:
          RAW_CLOUD_KEY: ${{ secrets.YANDEX_CLOUD_KEY }} 
        run: |
          echo "$RAW_CLOUD_KEY" > key.json

      - name: Cloud access.
        env:
          YC_SERVICE_ACCOUNT_KEY_FILE: "./key.json"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
        run: |
          terraform init

      - name: Deploy Infrastructure.
        env:
          YC_SERVICE_ACCOUNT_KEY_FILE: "./key.json"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
        run: |
          terraform apply -auto-approve

            # 8. Запуск вашего конфигурационного плейбука
      - name: Run Ansible Playbook
        working-directory: ./ansible-code
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_VAULT_PASSWORD_FILE: "./.vault_pass"
        run: |
          echo "$VAULT_PASS" > ./.vault_pass
          ansible-playbook -i inventory.ini site.yml
          rm -f ./.vault_pass
