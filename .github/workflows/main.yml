name: CI

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Terraform repo
        uses: actions/checkout@v4

      - name: Checkout Ansible repo
        uses: actions/checkout@v4
        with:
          repository: 'LeonLewiz/ansible-lab'
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}
          path: ansible-code

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Setup Python & Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          .venv/bin/pip install ansible

      - name: Export cloud key
        env:
          RAW_CLOUD_KEY: ${{ secrets.YANDEX_CLOUD_KEY }}
        run: echo "$RAW_CLOUD_KEY" > key.json

      - name: Terraform init
        env:
          YC_SERVICE_ACCOUNT_KEY_FILE: ./key.json
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
          TF_VAR_inventory_path: ./ansible-code/hosts.ini
        run: terraform init

      - name: Terraform apply
        env:
          YC_SERVICE_ACCOUNT_KEY_FILE: ./key.json
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
          TF_VAR_inventory_path: ./ansible-code/hosts.ini
        run: terraform apply -auto-approve

      - name: Verify inventory
        working-directory: ./ansible-code
        run: cat hosts.ini

      - name: Run Ansible Playbook
        working-directory: ./ansible-code
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          echo "$VAULT_PASS" > "$RUNNER_TEMP/.vault_pass"
          ../.venv/bin/ansible-playbook -i hosts.ini site.yml \
            --vault-password-file "$RUNNER_TEMP/.vault_pass"
