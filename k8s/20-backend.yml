apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-nginx-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cr.yandex/${var.registry_id}/backend:sha-9d291ff
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_PASSWORD }
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: my-nginx-site
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
