apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: my-nginx-site
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: cr.yandex/crpk5978o767co0bur2k/backup:sha-5dfc282
              env:
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef: { name: app-config, key: DB_HOST }
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef: { name: app-config, key: DB_NAME }
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef: {name: app-config, key: DB_USER }
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: db-secret, key: DB_PASSWORD }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: backup-s3-secret, key: AWS_ACCESS_KEY_ID }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: backup-s3-secret, key: AWS_SECRET_ACCESS_KEY }
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits: { cpu: "200m", memory: "256Mi" }
